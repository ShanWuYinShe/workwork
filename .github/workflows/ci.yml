name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # main push 的 CI 是合并门禁本身,取消可能打断"合并前最后验证";
  # PR 上旧 commit 的构建才值得取消。
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/heads/main') }}

permissions:
  contents: read

jobs:
  admin:
    name: Admin (Go + UI)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.8'
          cache: true
          cache-dependency-path: services/admin/go.sum

      - name: gofmt
        run: |
          test -z "$(gofmt -l services/admin/)"
          test -z "$(gofmt -l services/docker_proxy/)"
      - name: go vet
        run: |
          go vet -C services/admin ./...
          go vet -C services/docker_proxy ./...
      - name: go test
        run: |
          go test -C services/admin -race ./...
          go test -C services/docker_proxy -race ./...
      - name: shell syntax + shellcheck（覆盖全部 .sh）
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          find scripts setup-networks.sh services/nginx services/xray \
            -name '*.sh' -type f 2>/dev/null | while read -r sh; do
            echo "== bash -n + shellcheck: $sh"
            bash -n "$sh"
            shellcheck -S warning "$sh"
          done
      - name: compose config 校验（无 .env，仅验结构与插值合法性）
        run: docker compose config -q

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      # v6 起 action 运行在 node24,v4 会在 runner 上触发 Node.js 20 弃用警告
      - name: cache bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('services/admin/ui/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: ui lint + check + format + build（与 make check 对齐）
        run: |
          bun install --cwd services/admin/ui --frozen-lockfile
          bun run --cwd services/admin/ui format:check
          bun run --cwd services/admin/ui lint
          bun run --cwd services/admin/ui check
          bun run --cwd services/admin/ui build

  # gosec 静态安全扫描（报告模式）：-no-fail 不阻塞合并，输出进 CI 日志供
  # 巡检。存量 96 项发现已逐类甄别为扫描器误报或刻意设计（G101=路径常量、
  # G301/302=nginx 组读取的刻意权限、G304/G703=正则约束后的路径、G104=idiomatic
  # f.Close），升级为阻断门禁需先把误报类别换成精确的逐行豁免并复核。
  security-scan:
    name: Security scan (gosec, report-only)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.8'
          cache: true
          cache-dependency-path: services/admin/go.sum
      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
          gosec -no-fail -quiet -fmt text ./...
        working-directory: services/admin

  # 已知漏洞扫描（Go 标准库 + 依赖）。docker_proxy 当前零发现,作阻断门禁;
  # admin 当前命中的 2 项为 GO-2026-4887/4883(Moby daemon 侧 AuthZ 插件绕过/
  # 插件校验 off-by-one),实测升级 docker/docker v28.5.2 后仍存在且 Fixed in:
  # N/A(无上游修复版本),本仓库仅以 client 库走 socket 调用、漏洞代码路径不可达,
  # 故 admin 走显式 allowlist 门禁:命中均属 allowlist 即放行,出现清单外新漏洞
  # 直接 fail(比原先的 continue-on-error 非阻断更强地保住"新漏洞可见")。
  # 另:setup-go 注册的 go problem matcher 会把 govulncheck 的调用栈逐条渲染成
  # failure 级 annotation(受每步 10 条上限,绿色 run 上挂一片红叉),admin 步骤
  # 先行关闭该 matcher,发现仍完整打印进日志,放行与否由 allowlist 决定。
  govulncheck:
    name: Vulnerability scan (govulncheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.8'
          cache: true
          cache-dependency-path: services/admin/go.sum
      # 阻断步骤在前,保留 problem matcher:docker_proxy 一旦出现发现,失败本身
      # 就是门禁,逐条调用栈注解仍有排查价值。
      - name: govulncheck (docker_proxy, blocking)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...
        working-directory: services/docker_proxy
      - name: govulncheck (admin, allowlist = GO-2026-4887/4883)
        env:
          GOVULN_ALLOWED: 'GO-2026-4883 GO-2026-4887'
        run: |
          echo "::remove-matcher owner=go::"
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          rc=0
          govulncheck ./... > "$RUNNER_TEMP/govulncheck-admin.log" 2>&1 || rc=$?
          cat "$RUNNER_TEMP/govulncheck-admin.log"
          ids=$(grep -oE 'GO-[0-9]{4}-[0-9]+' "$RUNNER_TEMP/govulncheck-admin.log" | sort -u)
          # 工具自身失败(网络/安装/崩溃)不得被当成"零发现"静默放行
          if [ "$rc" -ne 0 ] && [ -z "$ids" ]; then
            echo "::error::govulncheck 运行失败(exit=$rc)且未产出任何发现,先排查工具与网络"
            exit 1
          fi
          unexpected=""
          if [ -n "$ids" ]; then
            unexpected=$(comm -23 \
              <(echo "$ids" | tr ' ' '\n' | sort) \
              <(echo "$GOVULN_ALLOWED" | tr ' ' '\n' | sort))
          fi
          if [ -n "$unexpected" ]; then
            echo "::error::admin 出现 allowlist($GOVULN_ALLOWED)之外的新漏洞: $unexpected"
            exit 1
          fi
          echo "admin govulncheck 通过:命中均为已知 allowlist(${ids:-无})"
        working-directory: services/admin

  # 密钥泄露扫描（阻断模式）:git 历史里发生过 cert 私钥入库事故
  # （docs/operations.md 有复盘），此类事故必须由门禁拦截而非人工发现。
  # 历史已甄别发现按指纹豁免于 .gitleaksignore(不含秘密内容),项目级
  # 误报豁免在 .gitleaks.toml;两者之外的新发现即 fail。
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 全量历史扫描
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.8'
          cache: true
          # 仓库根没有 go.mod,不指定时缓存恢复会报 "Restore cache failed" 警告
          cache-dependency-path: services/admin/go.sum
      - name: gitleaks
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          gitleaks git . -c .gitleaks.toml

  # 可构建服务镜像冒烟：全部四个服务在 CI 里真实 docker compose build，
  # 把「Dockerfile 构建坏」从部署时提前到合并前。默认缓存即可：GHA runner
  # 每次冷启本无缓存，--no-cache 只会在未来接入 build cache backend 时平白拖慢。
  image-build:
    name: Image build smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      # compose 内 ${NGINX_IPV6} 等变量无 .env 时为空串告警但不阻断 build
      # （本地实测 exit 0）。media/music 已拆分至独立站，各自仓库的 CI 覆盖。
      - name: docker compose build
        run: docker compose build admin docker-proxy xray nginx

  # 注意：media/music 已拆分至独立站（media.chaoset.com / music.chaoset.com），
  # 其源码与 CI 在各自仓库（media_center / music_player），部署亦随站走。
