name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  admin:
    name: Admin (Go + UI)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          cache: true
          cache-dependency-path: services/admin/go.sum

      - name: gofmt
        run: test -z "$(gofmt -l services/admin/)"
      - name: go vet
        run: go vet -C services/admin ./...
      - name: go test
        run: go test -C services/admin ./...
      - name: shell syntax
        run: |
          bash -n scripts/deploy-changed.sh
          bash -n scripts/backup.sh

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: ui lint + check + format + build（与 make check 对齐）
        run: |
          bun install --cwd services/admin/ui --frozen-lockfile
          bun run --cwd services/admin/ui format:check
          bun run --cwd services/admin/ui lint
          bun run --cwd services/admin/ui check
          bun run --cwd services/admin/ui build

  # gosec 静态安全扫描（报告模式）：-no-fail 不阻塞合并，输出进 CI 日志供
  # 巡检。存量 96 项发现已逐类甄别为扫描器误报或刻意设计（G101=路径常量、
  # G301/302=nginx 组读取的刻意权限、G304/G703=正则约束后的路径、G104=idiomatic
  # f.Close），升级为阻断门禁需先把误报类别换成精确的逐行豁免并复核。
  security-scan:
    name: Security scan (gosec, report-only)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          cache: true
          cache-dependency-path: services/admin/go.sum
      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.29.0
          gosec -no-fail -quiet -fmt text ./...
        working-directory: services/admin

  # 注意：media_center / music_player 以 git submodule 引入，且均为私有仓库，
  # 本仓库的 GITHUB_TOKEN 无权 clone（SSH 更无 key），故不在此测它们。
  # 两仓库各自的 CI 门禁覆盖 media_server / music_server / vod_extractor；
  # 集成形态（compose 构建）由部署时 docker compose build 保证。
