name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  admin:
    name: Admin (Go + UI)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          cache: true
          cache-dependency-path: services/admin/go.sum

      - name: gofmt
        run: test -z "$(gofmt -l services/admin/)"
      - name: go vet
        run: go vet -C services/admin ./...
      - name: go test
        run: go test -C services/admin ./...

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'

      - name: ui build
        run: |
          bun install --cwd services/admin/ui --frozen-lockfile
          bun run --cwd services/admin/ui build

  media:
    name: Media Center (submodule)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          cache: true
          cache-dependency-path: services/media_center/media_server/go.sum

      - name: media_server build/vet/test
        run: |
          go build -C services/media_center/media_server -o /dev/null .
          go vet -C services/media_center/media_server ./...
          go test -C services/media_center/media_server ./...

  music:
    name: Music Server (submodule)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          cache: true
          cache-dependency-path: services/music_player/music_server/go.sum

      - name: music_server build/vet/test
        run: |
          go build -C services/music_player/music_server -o /dev/null .
          go vet -C services/music_player/music_server ./...
          go test -C services/music_player/music_server ./...
