# 依赖自动更新。已拆分的并列站点仓（media_center / music_player，含其
# netease_api）不在本仓库治理范围，由各自仓库的 CI/流程跟进。
version: 2
updates:
  - package-ecosystem: gomod
    directory: /services/admin
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /services/docker_proxy
    schedule:
      interval: weekly
    groups:
      go-minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /services/admin
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /services/docker_proxy
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /services/nginx
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /services/xray
    schedule:
      interval: weekly
  # UI 依赖(svelte/vite/eslint 等,bun.lock)此前无自动更新生态。Dependabot
  # 官方支持表列 Bun 生态(manifest 标注 bun.lockb);本仓为文本 bun.lock,
  # 兼容性未证实——先挂配置观察:识别到即自动开更新 PR,识别不到仅在
  # Dependabot 日志记录跳过,无副作用。
  - package-ecosystem: bun
    directory: /services/admin/ui
    schedule:
      interval: weekly
