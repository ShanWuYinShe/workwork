# 依赖自动更新。已拆分的并列站点仓（media_center / music_player，含其
# netease_api）不在本仓库治理范围，由各自仓库的 CI/流程跟进。
version: 2
updates:
  - package-ecosystem: gomod
    directory: /services/admin
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /services/docker_proxy
    schedule:
      interval: weekly
    groups:
      go-minor-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /services/admin
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /services/docker_proxy
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /services/nginx
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /services/xray
    schedule:
      interval: weekly
