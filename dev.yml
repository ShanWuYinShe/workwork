# dev-env Project Configuration
# This file is committed to git. Override locally with .env.

project: service

services:
  postgres:
    image: postgres:16-alpine
    port: 5433
    db: app
    user: app
    password: app123
  redis:
    image: redis:7-alpine
    port: 6379
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    api_port: 9002
    console_port: 9003
    user: minioadmin
    password: minioadmin123
  dev:
    ports:
      - 3000
      - 3001
      - 8080

network:
  name: ipvlan_docker
  subnet: 172.18.0.0/16
  ip_range: 172.18.0.0/24
  ipv6_subnet: "2605:a141:2322:2623::/64"
  ipv6_range: "2605:a141:2322:2623:1::/80"
  reserved: "172.18.0.1-172.18.0.50"
  alloc_start: "172.18.0.51"

xray:
  reality_dest: www.microsoft.com:443
  reality_server_names:
    - www.microsoft.com
  default_short_ids: abcdef
