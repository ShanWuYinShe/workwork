networks:
  test_net:
    driver: bridge
    name: "test_net"

services:
  postgres:
    image: postgres:16-alpine
    container_name: test-postgres
    environment:
      POSTGRES_DB: test
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test123
    volumes:
      - test_pg_data:/var/lib/postgresql/data
    networks:
      - test_net
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d test"]
      interval: 1s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: "no"
    labels:
      dev.env.type: "test-database"
      dev.env.service: "postgres"

  redis:
    image: redis:7-alpine
    container_name: test-redis
    command:
      - redis-server
      - --appendonly
      - "yes"
    volumes:
      - test_redis_data:/data
    networks:
      - test_net
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 15
      start_period: 3s
    restart: "no"
    labels:
      dev.env.type: "test-cache"
      dev.env.service: "redis"

  minio:
    image: minio/minio:latest
    container_name: test-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: testminio
      MINIO_ROOT_PASSWORD: testminio123
    volumes:
      - test_minio_data:/data
    networks:
      - test_net
    ports:
      - "9004:9000"
      - "9005:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: "no"
    labels:
      dev.env.type: "test-storage"
      dev.env.service: "minio"

volumes:
  test_pg_data:
    name: "test_pg_data"
  test_redis_data:
    name: "test_redis_data"
  test_minio_data:
    name: "test_minio_data"