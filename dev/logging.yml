services:
  postgres:
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  minio:
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  dev:
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
