[Definition]
# 匹配日志行末尾的 uri="<规范化路径>" 字段（见 nginx.conf.tmpl 的 auth_log），
# 而非 $request 原始请求行：nginx 已完成百分号解码与点段归一，/%61dmin/、
# //admin、/x/../admin 等变体在 location/auth 层与字面路径等价（同样 401），
# 但原始请求行不匹配旧 failregex——撞库计数被完全绕过。
# 前缀集与 location 保护范围一致。两类语义分开处理：
# - 精确型 /admin、/api/admin、/proxy/query：结尾负向先行 (?![-\w]) 保证
#   /administrator、/api/admin-legacy 等更长路径不误报，同时允许尾斜杠/子路径/
#   查询串（/admin、/admin/、/api/admin/x、/proxy/query 均命中）；
# - 前缀型 /assets/、/favicon.svg、/icons.svg：保护其下所有内容与变体，
#   前缀命中即可（/assets/x.js、/favicon.svg?v 均命中）。
# 两个分支必须同处 ^<HOST> 锚定的单一表达式内（分支收进同一个 uri=" 分组）：
# 顶层 | 会让第二支独立成无 <HOST> 的正则，fail2ban 提取不到主机该行不计入
# maxretry——assets/favicon 上的撞库将完全不受速率惩罚。
# ` - (?!- )\S+ \[` 只计"提交了错误凭证"的 401（$remote_user 非空）：撞库者
# 必然携带 Authorization 头，错一次密即计一次；浏览器冷启动质询期间并发的
# 页面/静态资源/接口请求不带凭证（remote_user 渲染为 "-"），属正常登录流程
# 而非攻击，不计入——此前全量计数迫使 maxretry 放大到 10 仍偶发误封。
# 已知边界：伪造以 "- " 开头的 $remote_user 的 Authorization 头可规避本
# jail，但该请求同样无法通过认证且 nginx limit_req 已约束其频率，不接受为
# 风险；真用户名 "-" 被误归入此类，同理只是理论边界（IsValidUsername 允许）。
failregex = ^<HOST> - (?!- )\S+ \[.*\] "[A-Z]+ .*" 401 \d+ "[^"]*" "[^"]*" upstream: [^ ]* uri="(?:(?:/admin|/api/admin|/proxy/query)(?![-\w])|/(?:assets/|favicon\.svg|icons\.svg))

[Init]
ignoreregex =
