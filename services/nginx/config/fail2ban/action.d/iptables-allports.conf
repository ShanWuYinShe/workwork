[Definition]
actionstart = iptables -N f2b-<name>
              iptables -A f2b-<name> -s <ip> -j RETURN
              iptables -I <chain> -p all -s <ip> -j f2b-<name>

actionstop = iptables -D <chain> -p all -s <ip> -j f2b-<name>
             iptables -F f2b-<name>
             iptables -X f2b-<name>

actionban = iptables -I f2b-<name> 1 -s <ip> -j DROP

actionunban = iptables -D f2b-<name> -s <ip> -j DROP

[Init]
chain = INPUT