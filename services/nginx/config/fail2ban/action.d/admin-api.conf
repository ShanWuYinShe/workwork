[Definition]
# Cloudflare Full Proxy safe action: calls admin API instead of iptables.
# Uses shared internal token for auth instead of RemoteAddr check.

actionban = curl -s -X POST -H 'X-Forwarded-User: fail2ban' -H 'X-Internal-Token: $(cat /etc/fail2ban/.internal-token)' -H 'Content-Type: application/json' -d '{"ip":"<ip>","reason":"fail2ban auto-block","duration":3600}' http://admin:8318/api/admin/security/block

actionunban = curl -s -X POST -H 'X-Forwarded-User: fail2ban' -H 'X-Internal-Token: $(cat /etc/fail2ban/.internal-token)' -H 'Content-Type: application/json' -d '{"ip":"<ip>"}' http://admin:8318/api/admin/security/unblock

[Init]
