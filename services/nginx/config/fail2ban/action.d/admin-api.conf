[Definition]
# Cloudflare Full Proxy safe action: calls admin API instead of iptables.
# Uses shared internal token for auth instead of RemoteAddr check.
# <bantime> is substituted by fail2ban from the active jail's `bantime`
# setting (in seconds), so each jail's configured duration is respected.

actionban = curl -s -X POST -H 'X-Forwarded-User: fail2ban' -H "X-Internal-Token: $(cat /etc/workwork/.internal-token)" -H 'Content-Type: application/json' -d '{"ip":"<ip>","reason":"fail2ban auto-block","duration":<bantime>}' http://admin:8318/api/admin/security/block

actionunban = curl -s -X POST -H 'X-Forwarded-User: fail2ban' -H "X-Internal-Token: $(cat /etc/workwork/.internal-token)" -H 'Content-Type: application/json' -d '{"ip":"<ip>"}' http://admin:8318/api/admin/security/unblock

[Init]
