[Definition]
# Cloudflare Full Proxy safe action: calls admin API instead of iptables.
# With CF Full Proxy, iptables sees CF IPs, not real client IPs.
# This action posts to the Go admin service which blocks by X-Real-IP.

actionban = curl -s -X POST -H 'X-Forwarded-User: fail2ban' -H 'Content-Type: application/json' -d '{"ip":"<ip>","reason":"fail2ban auto-block","duration":3600}' http://admin:8318/api/admin/security/block

actionunban = curl -s -X POST -H 'X-Forwarded-User: fail2ban' -H 'Content-Type: application/json' -d '{"ip":"<ip>"}' http://admin:8318/api/admin/security/unblock

[Init]
# No start/stop needed — admin service handles persistence
