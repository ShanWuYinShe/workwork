[Definition]
# Cloudflare Full Proxy safe action: calls admin API instead of iptables.
# Uses shared internal token for auth instead of RemoteAddr check.
# <bantime> is substituted by fail2ban from the active jail's `bantime`
# setting (in seconds), so each jail's configured duration is respected.
#
# --fail-with-body（替代 -f）：HTTP 4xx/5xx 时把 admin 返回的响应体
# （含 error / error_code）一并打印到 stderr → supervisord 日志，
# 便于区分「封禁失败」是参数问题还是服务问题，而不是只看到 curl 退出码。

actionban = curl -sS --connect-timeout 2 --max-time 5 --fail-with-body -X POST -H "X-Fail2Ban-Token: $(cat /etc/workwork/.fail2ban-token)" -H 'Content-Type: application/json' -d '{"ip":"<ip>","reason":"fail2ban auto-block","duration":<bantime>}' http://admin:8318/api/admin/security/block || echo "[fail2ban] block <ip> failed: admin returned an error (see response body above)" >&2

# unban 不设 --fail：目标 IP 可能在 bantime 到期前已被 admin 清理
# （cleanupExpired / 手动解封），此时 404 + BLOCK_NOT_FOUND 属预期，
# 直接静默容忍，避免把预期 404 当成 unban 失败告警。
# 注意：不要用 curl 的 -w '%{http_code}' 打印状态码——%{...} 会被
# fail2ban 当作 action 变量占位符解析（'%' must be followed by '%' or '('），
# 导致整个 action 配置加载失败、fail2ban 启动即退出（曾实测 exit 255）。
actionunban = curl -sS --connect-timeout 2 --max-time 5 -X POST -H "X-Fail2Ban-Token: $(cat /etc/workwork/.fail2ban-token)" -H 'Content-Type: application/json' -d '{"ip":"<ip>"}' http://admin:8318/api/admin/security/unblock

[Init]
