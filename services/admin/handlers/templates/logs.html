{{template "layout.html" .}}

{{define "content"}}
<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;">
        <h2 style="margin-bottom:0;">Logs: {{.ServiceName}}</h2>
        <div class="log-controls">
            <label style="font-size:0.8rem;color:#64748b;">Lines:</label>
            <select id="tail-select">
                <option value="50">50</option>
                <option value="100" selected>100</option>
                <option value="500">500</option>
                <option value="1000">1000</option>
            </select>
            <button class="btn btn-blue btn-sm" onclick="loadLogs()">Load</button>
            <button class="btn btn-green btn-sm" id="follow-btn" onclick="toggleFollow()">Follow</button>
            <a href="/admin/services" class="btn btn-gray btn-sm" style="line-height:1.5;">Back</a>
        </div>
    </div>
    <div class="log-viewer" id="log-output">
        <span style="color:#64748b;">Loading logs...</span>
    </div>
</div>

<script>
const serviceName = "{{.ServiceName}}";
let followEnabled = false;
let eventSource = null;

function loadLogs() {
    const tail = document.getElementById('tail-select').value;
    fetch('/admin/api/services/' + serviceName + '/logs?tail=' + tail)
        .then(r => r.text())
        .then(text => {
            document.getElementById('log-output').textContent = text || '(no logs)';
        })
        .catch(err => {
            document.getElementById('log-output').textContent = 'Error: ' + err;
        });
}

function toggleFollow() {
    const btn = document.getElementById('follow-btn');
    if (followEnabled) {
        if (eventSource) { eventSource.close(); eventSource = null; }
        followEnabled = false;
        btn.textContent = 'Follow';
        btn.className = 'btn btn-green btn-sm';
    } else {
        eventSource = new EventSource('/admin/api/services/' + serviceName + '/logs?follow=true');
        const output = document.getElementById('log-output');
        output.textContent = '';
        eventSource.onmessage = function(e) {
            output.textContent += e.data + '\n';
            output.scrollTop = output.scrollHeight;
        };
        eventSource.onerror = function() {
            output.textContent += '\n--- connection lost ---\n';
        };
        followEnabled = true;
        btn.textContent = 'Stop';
        btn.className = 'btn btn-red btn-sm';
    }
}

loadLogs();
</script>
{{end}}
