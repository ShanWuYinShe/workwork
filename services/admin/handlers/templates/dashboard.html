{{template "layout.html" .}}

{{define "content"}}
<div class="stats">
    <div class="stat-card">
        <div class="label">Services</div>
        <div class="value">{{len .Services}}</div>
    </div>
    <div class="stat-card">
        <div class="label">Running</div>
        <div class="value">{{countRunning .Services}}</div>
    </div>
    <div class="stat-card">
        <div class="label">Updated</div>
        <div class="value" style="font-size:1rem;">{{.Now}}</div>
    </div>
</div>

<div class="card">
    <h2>Service Status</h2>
    <table>
        <thead>
            <tr>
                <th>Service</th>
                <th>State</th>
                <th>Image</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {{range .Services}}
            <tr>
                <td><a href="/admin/services/{{.Name}}/logs" style="color:#60a5fa;text-decoration:none;">{{.Name}}</a></td>
                <td><span class="badge {{stateClass .State}}">{{.State}}</span></td>
                <td style="color:#94a3b8;font-size:0.75rem;">{{.Image}}</td>
                <td>
                    <div class="actions">
                        <form method="POST" action="/admin/services/{{.Name}}/restart">
                            <button class="btn btn-blue btn-sm" type="submit">Restart</button>
                        </form>
                        {{if eq .State "running"}}
                        <form method="POST" action="/admin/services/{{.Name}}/stop">
                            <button class="btn btn-red btn-sm" type="submit">Stop</button>
                        </form>
                        {{else}}
                        <form method="POST" action="/admin/services/{{.Name}}/start">
                            <button class="btn btn-green btn-sm" type="submit">Start</button>
                        </form>
                        {{end}}
                    </div>
                </td>
            </tr>
            {{end}}
        </tbody>
    </table>
</div>
{{end}}
