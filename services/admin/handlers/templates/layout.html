{{define "layout.html"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Admin{{if .Page}} - {{.Page}}{{end}}</title>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }
        .nav { background: #1e293b; padding: 0 1.5rem; display: flex; align-items: center; height: 3rem; border-bottom: 1px solid #334155; }
        .nav a { color: #94a3b8; text-decoration: none; padding: 0.5rem 1rem; font-size: 0.875rem; transition: color 0.15s; }
        .nav a:hover, .nav a.active { color: #f1f5f9; }
        .nav .brand { color: #f8fafc; font-weight: 600; margin-right: 2rem; font-size: 1rem; }
        .container { max-width: 1200px; margin: 0 auto; padding: 1.5rem; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 0.5rem; padding: 1.25rem; margin-bottom: 1rem; }
        .card h2 { font-size: 1rem; font-weight: 600; margin-bottom: 1rem; color: #f8fafc; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 0.5rem 0.75rem; font-size: 0.75rem; text-transform: uppercase; color: #64748b; border-bottom: 1px solid #334155; }
        td { padding: 0.625rem 0.75rem; border-bottom: 1px solid #1e293b; font-size: 0.875rem; }
        .badge { display: inline-block; padding: 0.125rem 0.5rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 500; }
        .badge-green { background: #064e3b; color: #6ee7b7; }
        .badge-red { background: #7f1d1d; color: #fca5a5; }
        .badge-yellow { background: #713f12; color: #fde68a; }
        .badge-gray { background: #374151; color: #d1d5db; }
        .btn { display: inline-block; padding: 0.25rem 0.75rem; border: none; border-radius: 0.375rem; font-size: 0.75rem; cursor: pointer; font-weight: 500; transition: opacity 0.15s; }
        .btn:hover { opacity: 0.85; }
        .btn-blue { background: #1d4ed8; color: #fff; }
        .btn-red { background: #b91c1c; color: #fff; }
        .btn-green { background: #15803d; color: #fff; }
        .btn-gray { background: #374151; color: #d1d5db; }
        .btn-sm { padding: 0.125rem 0.5rem; font-size: 0.7rem; }
        .actions { display: flex; gap: 0.25rem; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
        .stat-card { background: #1e293b; border: 1px solid #334155; border-radius: 0.5rem; padding: 1rem; }
        .stat-card .label { font-size: 0.75rem; color: #64748b; text-transform: uppercase; }
        .stat-card .value { font-size: 1.5rem; font-weight: 700; color: #f8fafc; margin-top: 0.25rem; }
        .log-viewer { background: #0f172a; border: 1px solid #334155; border-radius: 0.5rem; padding: 1rem; font-family: 'SF Mono', 'Fira Code', monospace; font-size: 0.8rem; height: 70vh; overflow-y: auto; white-space: pre-wrap; word-break: break-all; line-height: 1.5; }
        .log-controls { display: flex; gap: 0.5rem; margin-bottom: 1rem; align-items: center; }
        .log-controls select, .log-controls input { background: #1e293b; border: 1px solid #334155; color: #e2e8f0; padding: 0.25rem 0.5rem; border-radius: 0.375rem; font-size: 0.8rem; }
        .empty { text-align: center; padding: 3rem; color: #64748b; }
    </style>
</head>
<body>
    <nav class="nav">
        <span class="brand">Admin</span>
        <a href="/admin/" {{if eq .Page "dashboard"}}class="active"{{end}}>Dashboard</a>
        <a href="/admin/services" {{if eq .Page "services"}}class="active"{{end}}>Services</a>
    </nav>
    <div class="container">
        {{template "content" .}}
    </div>
</body>
</html>
{{end}}
