{{define "service_row"}}
<tr id="service-{{.Service.Name}}">
    <td><a href="/admin/services/{{.Service.Name}}/logs" style="color:#60a5fa;text-decoration:none;">{{.Service.Name}}</a></td>
    <td><span class="badge {{stateClass .Service.State}}">{{.Service.State}}</span></td>
    <td style="color:#94a3b8;font-size:0.8rem;">{{.Service.Status}}</td>
    <td style="color:#64748b;font-size:0.75rem;">{{.Service.Image}}</td>
    <td>
        <div class="actions">
            <form method="POST" action="/admin/services/{{.Service.Name}}/restart">
                <button class="btn btn-blue btn-sm" type="submit">Restart</button>
            </form>
            {{if eq .Service.State "running"}}
            <form method="POST" action="/admin/services/{{.Service.Name}}/stop">
                <button class="btn btn-red btn-sm" type="submit">Stop</button>
            </form>
            {{else}}
            <form method="POST" action="/admin/services/{{.Service.Name}}/start">
                <button class="btn btn-green btn-sm" type="submit">Start</button>
            </form>
            {{end}}
        </div>
    </td>
</tr>
{{end}}
