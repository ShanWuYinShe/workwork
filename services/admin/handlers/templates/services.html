{{template "layout.html" .}}

{{define "content"}}
<div class="card">
    <h2>Services</h2>
    <table>
        <thead>
            <tr>
                <th>Service</th>
                <th>State</th>
                <th>Status</th>
                <th>Image</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="services-table">
            {{range .Services}}
            <tr id="service-{{.Name}}">
                <td><a href="/admin/services/{{.Name}}/logs" style="color:#60a5fa;text-decoration:none;">{{.Name}}</a></td>
                <td><span class="badge {{stateClass .State}}">{{.State}}</span></td>
                <td style="color:#94a3b8;font-size:0.8rem;">{{.Status}}</td>
                <td style="color:#64748b;font-size:0.75rem;">{{.Image}}</td>
                <td>
                    <div class="actions">
                        <form method="POST" action="/admin/services/{{.Name}}/restart">
                            <button class="btn btn-blue btn-sm" type="submit">Restart</button>
                        </form>
                        {{if eq .State "running"}}
                        <form method="POST" action="/admin/services/{{.Name}}/stop">
                            <button class="btn btn-red btn-sm" type="submit">Stop</button>
                        </form>
                        {{else}}
                        <form method="POST" action="/admin/services/{{.Name}}/start">
                            <button class="btn btn-green btn-sm" type="submit">Start</button>
                        </form>
                        {{end}}
                        <a href="/admin/services/{{.Name}}/logs" class="btn btn-gray btn-sm" style="line-height:1.5;">Logs</a>
                    </div>
                </td>
            </tr>
            {{end}}
        </tbody>
    </table>
</div>
{{end}}
