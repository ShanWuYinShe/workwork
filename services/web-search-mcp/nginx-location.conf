# Web Search MCP 的 nginx 反代已集成进主仓库 nginx 配置模板,不再独立安装。
#
# 实际生效的 location 块定义在:
#   services/nginx/nginx.conf.tmpl   (占位符 __WEB_SEARCH_PUBLIC_PATH__/sse 与 /message)
# 由 admin 在运行时渲染(见 services/admin/deploy.go 的 genNginxConfigForMediaCenter),
# 默认公网路径 /api/web-search(可用 env WEB_SEARCH_PUBLIC_PATH 覆盖)。
#
# 下面保留一份等价的独立 location 片段,仅供单独部署本服务(不经主仓库 nginx)时参考。
# 替换 __PUBLIC_PATH__ 为对外暴露的路径前缀(例 /api/web-search)。

location = __PUBLIC_PATH__/sse {
    proxy_pass http://web-search-mcp:8320/sse;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # SSE 必须关闭缓冲
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
}

location __PUBLIC_PATH__/message {
    proxy_pass http://web-search-mcp:8320/message;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}
