services:
  xray:
    image: teddysun/xray
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./services/xray/config.json:/etc/xray/config.json:ro

  nginx:
    image: nginx:1.30-alpine
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./cert:/etc/nginx/certs:ro
      - ./services/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./services/nginx/.htpasswd:/etc/nginx/htpasswd/.htpasswd:ro
      - ./logs/nginx:/var/log/nginx
    depends_on:
      - cliproxyapi

  cliproxyapi:
    build:
      context: ./services/cliproxyapi
      dockerfile: Dockerfile
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./services/cliproxyapi/config.yaml:/CLIProxyAPI/config.yaml:ro
      - ./services/cliproxyapi:/root/.cli-proxy-api

  admin:
    build:
      context: ./services/admin
      dockerfile: Dockerfile
    restart: unless-stopped
    network_mode: host
    environment:
      - CF_TEAM_DOMAIN=${CF_TEAM_DOMAIN}
      - CF_POLICY_AUD=${CF_POLICY_AUD}
      - ADMIN_PORT=${ADMIN_PORT}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./.env:/app/.env:ro
      - ./logs:/app/logs
    depends_on:
      - nginx

  fail2ban:
    build:
      context: ./services/fail2ban
      dockerfile: Dockerfile
    restart: unless-stopped
    network_mode: host
    privileged: true
    volumes:
      - ./logs/nginx:/var/log/nginx:ro
      - ./services/fail2ban/data:/var/lib/fail2ban/data
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - nginx
