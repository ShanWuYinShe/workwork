networks:
  external_net:
    external: true
    name: ipvlan_docker
  internal_net:
    driver: bridge
    internal: true

services:
  xray-reality-liyou:
    image: teddysun/xray
    restart: unless-stopped
    networks:
      - external_net
      - internal_net
    volumes:
      - ./configs/xray-reality-liyou.json:/etc/xray/config.json:ro
  xray-reality-liusai:
    image: teddysun/xray
    restart: unless-stopped
    networks:
      - external_net
      - internal_net
    volumes:
      - ./configs/xray-reality-liusai.json:/etc/xray/config.json:ro
  nginx-xhttp-liyou:
    image: nginx:alpine
    restart: unless-stopped
    networks:
      - external_net
      - internal_net
    volumes:
      - ./cert:/etc/nginx/certs:ro
      - ./configs/nginx-xhttp-liyou.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - xray-reality-liyou
  nginx-xhttp-liusai:
    image: nginx:alpine
    restart: unless-stopped
    networks:
      - external_net
      - internal_net
    volumes:
      - ./cert:/etc/nginx/certs:ro
      - ./configs/nginx-xhttp-liusai.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - xray-reality-liusai
