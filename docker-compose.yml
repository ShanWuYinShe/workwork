name: workwork

services:
  nginx:
    build:
      context: ./services/nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      ipvlan_docker:
        ipv6_address: "${NGINX_IPV6}"
      internal_docker:
    volumes:
      - ./cert:/etc/nginx/certs:ro
      - ./.wework/generated/nginx:/etc/nginx/conf.d:ro
      - ./.wework/nginx-auth:/etc/nginx/htpasswd:ro
      - ./logs/nginx:/var/log/nginx
      - ./services/nginx/config/fail2ban:/etc/fail2ban/custom:ro
      - ./services/nginx/fail2ban-data:/var/lib/fail2ban/data
      - ./.wework:/etc/workwork:ro
      - /dev/shm:/dev/shm
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      # CHOWN: nginx master 进程需要 chown /var/cache/nginx/* 给 worker (uid 101)
      - CHOWN
      # SETGID+SETUID: nginx master 以 root 运行，worker 需要降权到 nginx (uid 101)
      - SETGID
      - SETUID
    depends_on:
      admin:
        condition: service_healthy
      xray:
        condition: service_healthy
      media_server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nginx -t >/dev/null && curl -fsS http://127.0.0.1:8080/nginx-health >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  xray:
    build:
      context: ./services/xray
      dockerfile: Dockerfile
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    ports:
      - "443:443"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    cap_drop:
      - ALL
    cap_add:
      # NET_ADMIN: entrypoint.sh 中 ip route 需要
      # SETGID+SETUID: su-exec 降权到 appuser 需要
      # CHOWN: entrypoint.sh 复制 root-only 配置后交给 appuser 读取
      # NET_BIND_SERVICE 不需要：容器内 ip_unprivileged_port_start=0，所有端口对非 root 开放
      - NET_ADMIN
      - SETGID
      - SETUID
      - CHOWN
    entrypoint: ["/entrypoint.sh"]
    networks:
      # Keep bridge first so Docker publishes host IPv4 443 to xray's bridge IP.
      # Public IPv6 reaches xray directly through ipvlan_docker; no forwarding
      # sidecar is needed.
      internal_docker: {}
      ipvlan_docker:
        ipv6_address: "${XRAY_IPV6}"
    volumes:
      - ./services/xray/entrypoint.sh:/entrypoint.sh:ro
      - ./.wework/generated/xray:/etc/xray:ro
      - /dev/shm:/dev/shm
    depends_on:
      admin:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -S /dev/shm/xrxh.socket && nc -z 127.0.0.1 443"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  vod_extractor:
    build:
      context: ./services/vod_extractor
      dockerfile: Dockerfile
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal_docker
    cap_drop:
      - ALL
    environment:
      - HOST=0.0.0.0
      - PORT=8790
      - VOD_EXTRACTOR_TIMEOUT_MS=${VOD_EXTRACTOR_TIMEOUT_MS:-30000}
      - VOD_EXTRACTOR_MAX_OUTPUT_BYTES=${VOD_EXTRACTOR_MAX_OUTPUT_BYTES:-20971520}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8790/health', timeout=2).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  media_server:
    build:
      context: ./services/media_server
      dockerfile: Dockerfile
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal_docker
    cap_drop:
      - ALL
    environment:
      - HOST=0.0.0.0
      - PORT=8787
      - VOD_EXTRACTOR_URL=http://vod_extractor:8790/extract
      - CONTENT_CATEGORIES_FILE=/config/contentCategories.json
      - BACKEND_CACHE_DIR=/cache
      - BACKEND_CACHE_MAX_BYTES=${MEDIA_SERVER_CACHE_MAX_BYTES:-53687091200}
      - CATEGORY_REFRESH_INTERVAL_MS=${MEDIA_SERVER_CATEGORY_REFRESH_INTERVAL_MS:-1800000}
      - PROVIDER_FETCH_TIMEOUT_MS=${MEDIA_SERVER_PROVIDER_FETCH_TIMEOUT_MS:-10000}
      - PROVIDER_SEARCH_TIMEOUT_MS=${MEDIA_SERVER_PROVIDER_SEARCH_TIMEOUT_MS:-15000}
      - SEARCH_DETAIL_TIMEOUT_MS=${MEDIA_SERVER_SEARCH_DETAIL_TIMEOUT_MS:-8000}
      - DETAIL_RESOLVE_TIMEOUT_MS=${MEDIA_SERVER_DETAIL_RESOLVE_TIMEOUT_MS:-35000}
      - VOD_EXTRACTOR_TIMEOUT_MS=${VOD_EXTRACTOR_TIMEOUT_MS:-30000}
    volumes:
      - media_server_cache:/cache
      - ./.wework/generated/media_center:/config:ro
    depends_on:
      admin:
        condition: service_healthy
      vod_extractor:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  admin:
    build:
      context: .
      dockerfile: ./services/admin/Dockerfile
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    user: "1001:1001"
    group_add:
      - "${DOCKER_GID:-988}"
    networks:
      - internal_docker
    cap_drop:
      - ALL
    environment:
      - CF_API_TOKEN=${CF_API_TOKEN:-}
      - INTERNAL_TOKEN=${INTERNAL_TOKEN:-}
      # IPv6 轮换（startupRotateIPv6 必需）
      - IPV6_SUBNET=${IPV6_SUBNET:-}
      - XRAY_IPV6=${XRAY_IPV6:-}
      - NGINX_IPV6=${NGINX_IPV6:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./.env:/app/.env:ro
      - ./logs:/app/logs
      - ./services/nginx/nginx.conf.tmpl:/app/configs/nginx.conf.tmpl:ro
      - ./.wework:/app/data
      - ./services/xray/config.json.tmpl:/app/configs/xray.json.tmpl:ro
      - ./services/media_server/src/contentCategories.json:/app/configs/media-center-content-categories.json:ro
      - ./services/nginx:/app/legacy-nginx:ro
      - ./services/xray:/app/legacy-xray:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8318/api/admin/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  ipvlan_docker:
    external: true
  internal_docker:
    driver: bridge

volumes:
  media_server_cache:
