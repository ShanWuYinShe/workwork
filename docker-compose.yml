name: workwork

services:
  nginx:
    build:
      context: ./services/nginx
      dockerfile: Dockerfile
      args:
        NGINX_VERSION: ${NGINX_VERSION:-1.30.1}
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    init: true
    deploy:
      resources:
        limits:
          memory: 192M
          cpus: "2.0"
    security_opt:
      - "no-new-privileges:true"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      internal_docker:
      ipvlan_docker:
        ipv6_address: "${NGINX_IPV6}"
    group_add:
      # 1001: read the fail2ban token generated by admin as 0640.
      - "1001"
      # 101: nginx workers need group access to xray's 0660 Unix socket.
      - "101"
    volumes:
      - ./cert:/etc/nginx/certs:ro
      - ./.wework/generated/nginx:/etc/nginx/conf.d:ro
      - ./.wework/nginx-auth:/etc/nginx/htpasswd:ro
      - ./logs/nginx:/var/log/nginx
      - ./services/nginx/config/fail2ban:/etc/fail2ban/custom:ro
      - ./services/nginx/fail2ban-data:/var/lib/fail2ban/data
      - ./.wework/.fail2ban-token:/etc/workwork/.fail2ban-token:ro
      - xray_socket:/run/xray
    cap_drop:
      - ALL
    cap_add:
      # NET_ADMIN: admin 通过 docker exec 在容器内恢复轮换 IPv6 地址需要。
      - NET_ADMIN
      # CHOWN: nginx master 进程需要 chown /var/cache/nginx/* 给 worker (uid 101)
      - CHOWN
      # SETGID+SETUID: nginx master 以 root 运行，worker 需要降权到 nginx (uid 101)
      - SETGID
      - SETUID
    depends_on:
      admin:
        condition: service_healthy
    healthcheck:
      # 只探测真实存活信号(serving /nginx-health 返回 204)。不再跑 nginx -t:
      # 其会以 root 打开 error_log 文件做校验,而日志文件归 uid 101(worker),
      # cap_drop:ALL 下 root 无 DAC_OVERRIDE 无法写入 → 误报 unhealthy。配置语法
      # 已在启动时校验,reload 失败也会安全保留旧配置,运行期无需重复 nginx -t。
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/nginx-health >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  xray:
    build:
      context: ./services/xray
      dockerfile: Dockerfile
      args:
        ALPINE_VERSION: ${ALPINE_VERSION:-3.22.4}
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    init: true
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "1.0"
    security_opt:
      - "no-new-privileges:true"
    # IPv4 443 由 xray-forward 发布(连接 ipvlan 后 Docker 端口映射失效)
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    cap_drop:
      - ALL
    cap_add:
      # NET_ADMIN: entrypoint.sh 中 ip route 需要
      # SETGID+SETUID: su-exec 降权到 appuser 需要
      # CHOWN: entrypoint.sh 复制 root-only 配置后交给 appuser 读取
      # NET_BIND_SERVICE 不需要：容器内 ip_unprivileged_port_start=0，所有端口对非 root 开放
      - NET_ADMIN
      - SETGID
      - SETUID
      - CHOWN
    entrypoint: ["/entrypoint.sh"]
    group_add:
      # 1001: read generated xray config after admin tightens it to 0640.
      - "1001"
    networks:
      # Keep the dedicated bridge first so Docker publishes host IPv4 443 to
      # xray's egress bridge IP without joining the private admin/media network.
      # Public IPv6 reaches xray directly through ipvlan_docker.
      xray_egress: {}
      ipvlan_docker:
        ipv6_address: "${XRAY_IPV6}"
    volumes:
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
      - ./services/xray/entrypoint.sh:/entrypoint.sh:ro
      - ./.wework/generated/xray:/etc/xray:ro
      - xray_socket:/run/xray
    depends_on:
      admin:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -S /run/xray/xrxh.socket && nc -z 127.0.0.1 443"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # IPv4 直连发布: 宿主 0.0.0.0:443 → socat → xray_egress 网络内 xray:443。
  # xray 同时连接 ipvlan 时 Docker(29.x) 会把 ipvlan 选为 gwep4,端口映射
  # 整体失效(与连接顺序无关),因此 IPv4 入站由这个纯 bridge 容器发布。
  xray-forward:
    build:
      context: ./services/xray
      dockerfile: Dockerfile.forward
      args:
        ALPINE_VERSION: ${ALPINE_VERSION:-3.22.4}
    restart: unless-stopped
    networks:
      - xray_egress
    cap_drop:
      - ALL
    ports:
      - "0.0.0.0:443:443"
    depends_on:
      xray:
        condition: service_healthy

  media_server:
    build:
      context: ./services/media_center/media_server
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"
    security_opt:
      - "no-new-privileges:true"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal_docker
    cap_drop:
      - ALL
    tmpfs:
      # /cache 在 Dockerfile 中声明为 VOLUME 但服务未使用；用 tmpfs 覆盖避免匿名卷累积。
      - /cache
    environment:
      - TZ=Asia/Shanghai
      - HOST=0.0.0.0
      - PORT=8787
      - CONTENT_CATEGORIES_FILE=/config/contentCategories.json
      # Provider 凭证（如 bilibili SESSDATA），由 admin 生成注入。
      - PROVIDER_CREDENTIALS_FILE=/config/providerCredentials.json
      # 分类维护数据库(catalog)与内部管理接口令牌。
      - MEDIA_SERVER_CATALOG_DB=/app/data/catalog.db
      - MEDIA_SERVER_INTERNAL_TOKEN=${MEDIA_SERVER_INTERNAL_TOKEN:-}
      # App 更新下载地址:显式固定公网基址,禁止从请求 Host 头推导(防 Host 头投毒
      # 引导恶意 APK)。留空时 media_server 只接受白名单/内网 Host,公网不可用。
      - MEDIA_SERVER_PUBLIC_URL=${MEDIA_SERVER_PUBLIC_URL:-https://yinghuoren.com}
      # App 端凭证接口令牌:与 App 构建时注入的 APP_API_TOKEN 一致;为空则凭证
      # 接口一律 401(App 降级无凭证模式)。
      - MEDIA_SERVER_APP_API_TOKEN=${MEDIA_SERVER_APP_API_TOKEN:-}
    volumes:
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
      - ./.wework/generated/media_center:/config:ro
      - media_center_data:/app/data
    depends_on:
      admin:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8787/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  admin:
    build:
      context: .
      dockerfile: ./services/admin/Dockerfile
      args:
        BUN_VERSION: ${BUN_VERSION:-1.3.14}
        GO_VERSION: ${GO_VERSION:-1.26.2}
        ALPINE_VERSION: ${ALPINE_VERSION:-3.22.4}
    restart: unless-stopped
    init: true
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    security_opt:
      - "no-new-privileges:true"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    user: "1001:1001"
    group_add:
      - "${DOCKER_GID:-988}"
    networks:
      - internal_docker
    cap_drop:
      - ALL
    environment:
      - TZ=Asia/Shanghai
      - COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME:-workwork}
      - CF_API_TOKEN=${CF_API_TOKEN:-}
      - INTERNAL_TOKEN=${INTERNAL_TOKEN:-}
      - TRUSTED_PROXY_CIDRS=${TRUSTED_PROXY_CIDRS:-}
      - TRUSTED_PROXY_HOSTS=${TRUSTED_PROXY_HOSTS:-}
      # IPv6 轮换（startupRotateIPv6 必需）
      - IPV6_SUBNET=${IPV6_SUBNET:-}
      - XRAY_IPV6=${XRAY_IPV6:-}
      - NGINX_IPV6=${NGINX_IPV6:-}
      # 媒体中心分类预采集管理：admin 代理 media_server 内部接口（同一令牌）
      - MEDIA_SERVER_INTERNAL_TOKEN=${MEDIA_SERVER_INTERNAL_TOKEN:-}
      - MEDIA_CENTER_INTERNAL_URL=${MEDIA_CENTER_INTERNAL_URL:-http://media_server:8787}
    volumes:
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./.env:/app/.env:ro
      - ./logs:/app/logs
      - ./services/nginx/nginx.conf.tmpl:/app/configs/nginx.conf.tmpl:ro
      - ./.wework:/app/data
      - ./services/xray/config.json.tmpl:/app/configs/xray.json.tmpl:ro
      - ./services/media_center/media_server/src/contentCategories.json:/app/configs/media-center-content-categories.json:ro
      - ./services/nginx:/app/legacy-nginx:ro
      - ./services/xray:/app/legacy-xray:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8318/api/admin/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web-search-mcp:
    build:
      context: ./services/web-search-mcp
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
    init: true
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
    security_opt:
      - "no-new-privileges:true"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    cap_drop:
      - ALL
    networks:
      - internal_docker
    environment:
      - TZ=Asia/Shanghai
      - PORT=8320
      # MCP 客户端需在 Authorization header 携带此 token。
      # 留空则跳过认证（仅推荐内部网络使用）。
      - AUTH_TOKEN=${WEB_SEARCH_AUTH_TOKEN:-}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8320/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  ipvlan_docker:
    external: true
  internal_docker:
    driver: bridge
  xray_egress:
    driver: bridge

volumes:
  xray_socket:
  media_center_data:
