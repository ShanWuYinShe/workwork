name: workwork

services:
  nginx:
    # 不可变版本 tag：deploy-changed.sh 导出 IMAGE_TAG 后构建，
    # 回滚 = IMAGE_TAG=<旧tag> up -d（默认 latest 保持本地习惯）。
    image: workwork-nginx:${IMAGE_TAG:-latest}
    build:
      context: ./services/nginx
      dockerfile: Dockerfile
      args:
        NGINX_VERSION: ${NGINX_VERSION:-1.30.4}
        APK_MIRROR: ${APK_MIRROR:-mirrors.aliyun.com}
        # OCI revision 标签来源，deploy-changed.sh 会 export（未导出时为 dev）
        GIT_VERSION: ${GIT_VERSION:-dev}
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    init: true
    deploy:
      resources:
        limits:
          memory: 192M
          cpus: "2.0"
          # fail2ban(python)/cron/nginx workers 的 fork 洪泛防线
          # (192M 内存是第一道,这是第二道)。
          pids: 256
    security_opt:
      - "no-new-privileges:true"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      internal_docker:
      ipvlan_docker:
        ipv6_address: "${NGINX_IPV6}"
    group_add:
      # 101: nginx workers need group access to xray's 0660 Unix socket.
      # (fail2ban token 不需要属组:fail2ban 以 root 运行,有 DAC_OVERRIDE 可读 0640)
      - "101"
    volumes:
      - ./cert:/etc/nginx/certs:ro
      - ./.wework/generated/nginx:/etc/nginx/conf.d:ro
      - ./.wework/nginx-auth:/etc/nginx/htpasswd:ro
      - ./logs/nginx:/var/log/nginx
      - ./services/nginx/fail2ban-data:/var/lib/fail2ban/data
      # 目录挂载(勿改回单文件):单文件 bind 会把缺失 source 建成目录导致首次
      # 部署死锁;且绑定 inode 后 admin 的 rename 轮换在容器内不可见。
      - ./.wework/fail2ban:/etc/workwork/fail2ban:ro
      - xray_socket:/run/xray
    cap_drop:
      - ALL
    cap_add:
      # NET_ADMIN: admin 通过 docker exec 在容器内恢复轮换 IPv6 地址需要。
      - NET_ADMIN
      # CHOWN: nginx master 进程需要 chown /var/cache/nginx/* 给 worker (uid 101)
      - CHOWN
      # SETGID+SETUID: nginx master 以 root 运行，worker 需要降权到 nginx (uid 101)
      - SETGID
      - SETUID
      # DAC_OVERRIDE: logrotate 后 master reopen 会把日志 chown 给 uid 101(0644),
      # 此后 root master 无此 cap 便打不开自己的日志文件,reload(新 cycle 重新
      # 打开日志)全部静默失败——封禁同步/IP 轮换/配置更新长期不生效。HTTP 暴露
      # 面在无任何 cap 的 worker 上,master 多此 cap 风险可控(docker 默认含此 cap)。
      - DAC_OVERRIDE
    depends_on:
      admin:
        condition: service_healthy
      xray:
        condition: service_healthy
    healthcheck:
      # 只探测真实存活信号(serving /nginx-health 返回 204)。不再跑 nginx -t:
      # 其会以 root 打开 error_log 文件做校验,而日志文件归 uid 101(worker),
      # cap_drop:ALL 下 root 无 DAC_OVERRIDE 无法写入 → 误报 unhealthy。配置语法
      # 已在启动时校验,reload 失败也会安全保留旧配置,运行期无需重复 nginx -t。
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/nginx-health >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  xray:
    image: workwork-xray:${IMAGE_TAG:-latest}
    build:
      context: ./services/xray
      dockerfile: Dockerfile
      args:
        ALPINE_VERSION: ${ALPINE_VERSION:-3.24.1}
        APK_MIRROR: ${APK_MIRROR:-mirrors.aliyun.com}
        # OCI revision 标签来源，deploy-changed.sh 会 export（未导出时为 dev）
        GIT_VERSION: ${GIT_VERSION:-dev}
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    init: true
    deploy:
      resources:
        limits:
          # packet-up 上行被拆成高频小 POST，每个分片都要过一次 nginx→unix
          # socket→Xray 的 HTTP 解析与 VLESS 解封装，是 CPU 密集而非内存密集。
          # cpus 1.0 会把吞吐钉死在单核：实测单核下客户端已跑满本机 ~4MB/s 线路，
          # 再调 Xray 参数不再有效。放宽到 2.0 给并发分片留出一个核的余量。
          # 内存：并发提升后连接缓冲与 uploadQueue 乱序重组堆随之增长，128M 在
          # 高并发下 OOM 会静默重启代理，放宽到 256M。
          memory: 256M
          cpus: "2.0"
    security_opt:
      - "no-new-privileges:true"
    # 无入站端口：XHTTP 经 nginx Unix socket 接入（xray 不声明 ports）
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    cap_drop:
      - ALL
    cap_add:
      # NET_ADMIN: entrypoint.sh 中 ip route 需要
      # SETGID+SETUID: su-exec 降权到 appuser 需要
      # CHOWN: entrypoint.sh 复制 root-only 配置后交给 appuser 读取
      # NET_BIND_SERVICE 不需要：容器内 ip_unprivileged_port_start=0，所有端口对非 root 开放
      - NET_ADMIN
      - SETGID
      - SETUID
      - CHOWN
    entrypoint: ["/entrypoint.sh"]
    group_add:
      # 1001: read generated xray config after admin tightens it to 0640.
      - "1001"
    networks:
      # xray_egress 仅为 IPv4 出站 NAT bridge（entrypoint.sh 设默认路由），
      # 不加入 private admin 网络。公网 IPv6 经 ipvlan_docker 直连。
      xray_egress: {}
      ipvlan_docker:
        ipv6_address: "${XRAY_IPV6}"
    volumes:
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
      - ./services/xray/entrypoint.sh:/entrypoint.sh:ro
      - ./.wework/generated/xray:/etc/xray:ro
      - xray_socket:/run/xray
    depends_on:
      admin:
        condition: service_healthy
    healthcheck:
      # 双条件:socket 存在 + xray 进程存在。仅探 socket 漏判两类假活:进程
      # hang(socket 在但已不 accept)与崩溃后 socket 文件残留(仅启动时清理)。
      # 按进程名匹配而不用 pgrep -f:healthcheck 自身 shell 命令行含 socket
      # 路径里的 "xray" 字样,-f 会误匹配自身恒真(busybox pgrep 按名匹配
      # 已实测:进程存活 exit 0,退出后 exit 1)。
      test: ["CMD-SHELL", "test -S /run/xray/xrxh.socket && pgrep xray >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # docker API 白名单代理:admin 不再直接持有 /var/run/docker.sock(全权
  # = 宿主 root),中间经自研 Go 白名单反代(services/docker_proxy)——只放行
  # admin 实际调用的端点(containers 读写/exec/events/info/version/ping),
  # 镜像/网络/swarm/volumes 全部拒绝。admin 被攻破时的爆炸半径从"宿主 root"
  # 缩小到"容器启停 + exec"。端点清单来自 services/admin 的调用面盘点,新增
  # docker API 调用时必须同步在这里放行(白名单单测 TestAllowed 与需
  # TEST_DOCKER_HOST 的集成测试 TestDockerProxyWhitelist 双重锁定)。
  docker-proxy:
    image: workwork-docker-proxy:${IMAGE_TAG:-latest}
    build:
      context: ./services/docker_proxy
      dockerfile: Dockerfile
      args:
        GO_VERSION: ${GO_VERSION:-1.26.10}
        ALPINE_VERSION: ${ALPINE_VERSION:-3.24.1}
        APK_MIRROR: ${APK_MIRROR:-mirrors.aliyun.com}
        GIT_VERSION: ${GIT_VERSION:-dev}
    # 自建精确白名单(不用 tecnativa:其 CONTAINERS=1 会放行 /containers/create
    # 与 DELETE,bind-mount 逃逸仍可行)。白名单在 services/docker_proxy/main.go,
    # method+path 级,越权一律 403;新增 admin docker API 调用时同步。
    restart: unless-stopped
    init: true
    environment:
      # 与 admin 的 COMPOSE_PROJECT_NAME 同源:容器归属校验放行的项目名必须
      # 等于实际 compose 项目名。此前只吃硬编码默认值 workwork,改了
      # COMPOSE_PROJECT_NAME 就与 admin 注入的 label 过滤不一致——本栈自己的
      # 容器会被归属校验全部拒绝(面板操作静默失效)。
      - ALLOWED_COMPOSE_PROJECTS=${COMPOSE_PROJECT_NAME:-workwork}
    deploy:
      resources:
        limits:
          # 无依赖静态单文件程序,资源需求固定;64M/0.25 防异常内存膨胀波及宿主
          # (全部服务均有 limits)。
          memory: 64M
          cpus: "0.25"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      # :ro 只约束 bind mount 的打开语义,经 socket 发起的 API 读写不受限——
      # 实际防线是容器内 docker-proxy 的 method+path 白名单 + 容器归属校验。
      # 保留 :ro 仅表达"代理不修改 socket 文件本身"的意图,勿视作安全边界。
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker_proxy
    security_opt:
      - "no-new-privileges:true"
    cap_drop:
      - ALL
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  admin:
    image: workwork-admin:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: ./services/admin/Dockerfile
      args:
        BUN_VERSION: ${BUN_VERSION:-1.3.14}
        GO_VERSION: ${GO_VERSION:-1.26.10}
        ALPINE_VERSION: ${ALPINE_VERSION:-3.24.1}
        APK_MIRROR: ${APK_MIRROR:-mirrors.aliyun.com}
        GIT_VERSION: ${GIT_VERSION:-dev}
    restart: unless-stopped
    init: true
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
          pids: 128
    security_opt:
      - "no-new-privileges:true"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    user: "1001:1001"
    networks:
      - internal_docker
      - docker_proxy
    group_add:
      # 101 = nginx worker 组:admin 以它写 htpasswd(0640 group 101,nginx
      # worker 可读、宿主其他用户不可读)。代码侧 chgrp 失败会自动退回 0644,
      # 不会造成 nginx 读不了凭证的整站锁死。
      - "101"
    cap_drop:
      - ALL
    environment:
      - TZ=Asia/Shanghai
      # 经白名单代理访问 docker API(不再直挂 docker.sock)。
      - DOCKER_HOST=tcp://docker-proxy:2375
      - COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME:-workwork}
      - CF_API_TOKEN=${CF_API_TOKEN:-}
      - INTERNAL_TOKEN=${INTERNAL_TOKEN:-}
      # 可选:internal token 路径前缀白名单(逗号分隔)。配置后 X-Internal-Token
      # 只能豁免这些前缀,其余路径退回正常认证;留空保持全权(兼容外部自动化)。
      - INTERNAL_TOKEN_ALLOWED_PREFIXES=${INTERNAL_TOKEN_ALLOWED_PREFIXES:-}
      - TRUSTED_PROXY_CIDRS=${TRUSTED_PROXY_CIDRS:-}
      - TRUSTED_PROXY_HOSTS=${TRUSTED_PROXY_HOSTS:-}
      # IPv6 轮换（startupRotateIPv6 必需）
      - IPV6_SUBNET=${IPV6_SUBNET:-}
      - XRAY_IPV6=${XRAY_IPV6:-}
      - NGINX_IPV6=${NGINX_IPV6:-}
      # 可选:关键事件通知(Security 封禁/解封、限流自动封禁、xhttp 自愈达上限),
      # admin 异步 POST JSON,失败只记日志;部署失败通知也读同名变量。
      - WEBHOOK_URL=${WEBHOOK_URL:-}
      - ALERT_MTLS_CERT=${ALERT_MTLS_CERT:-}
      - ALERT_MTLS_KEY=${ALERT_MTLS_KEY:-}
    volumes:
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
      - ./.env:/app/.env:ro
      # 证书到期监控(只读;nginx 的可写挂载不受影响)
      - ./cert:/app/certs:ro
      # mTLS 推送证书(WEBHOOK_URL 指向 ops-portal 网关时):宿主目录只读挂载,
      # 容器内固定 /webhook-caller;默认 ~/.webhook-caller(与 hotspot 脚本一致)。
      # 目录不存在时 docker 会建出空目录,Go 端无证书文件即照常无证推送。
      - ${WEBHOOK_CALLER_DIR:-${HOME}/.webhook-caller}:/webhook-caller:ro
      - ./logs:/app/logs
      - ./.wework:/app/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:${ADMIN_PORT:-8318}/api/admin/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    # docker API 经白名单代理,proxy 未起时 admin 的 docker 调用全部失败;
    # 启动顺序由 compose 保证(不要求 healthy:proxy 就绪在秒级,admin 有
    # daemonGuard 退避,started 足够)。
    depends_on:
      docker-proxy:
        condition: service_started

networks:
  ipvlan_docker:
    external: true
  internal_docker:
    driver: bridge
  xray_egress:
    driver: bridge
  # docker API 白名单代理专用:仅 admin 与 docker-proxy 接入,
  # 第三方镜像容器无法触达 docker API 面。
  docker_proxy:
    driver: bridge
    internal: true

volumes:
  xray_socket:
