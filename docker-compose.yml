name: workwork

services:
  nginx:
    # 不可变版本 tag：deploy-changed.sh 导出 IMAGE_TAG 后构建，
    # 回滚 = IMAGE_TAG=<旧tag> up -d（默认 latest 保持本地习惯）。
    image: workwork-nginx:${IMAGE_TAG:-latest}
    build:
      context: ./services/nginx
      dockerfile: Dockerfile
      args:
        NGINX_VERSION: ${NGINX_VERSION:-1.30.4}
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    init: true
    deploy:
      resources:
        limits:
          memory: 192M
          cpus: "2.0"
    security_opt:
      - "no-new-privileges:true"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      internal_docker:
      ipvlan_docker:
        ipv6_address: "${NGINX_IPV6}"
    group_add:
      # 101: nginx workers need group access to xray's 0660 Unix socket.
      # (fail2ban token 不需要属组:fail2ban 以 root 运行,有 DAC_OVERRIDE 可读 0640)
      - "101"
    volumes:
      - ./cert:/etc/nginx/certs:ro
      - ./.wework/generated/nginx:/etc/nginx/conf.d:ro
      - ./.wework/nginx-auth:/etc/nginx/htpasswd:ro
      - ./logs/nginx:/var/log/nginx
      - ./services/nginx/config/fail2ban:/etc/fail2ban/custom:ro
      - ./services/nginx/fail2ban-data:/var/lib/fail2ban/data
      # 目录挂载(勿改回单文件):单文件 bind 会把缺失 source 建成目录导致首次
      # 部署死锁;且绑定 inode 后 admin 的 rename 轮换在容器内不可见。
      - ./.wework/fail2ban:/etc/workwork/fail2ban:ro
      - xray_socket:/run/xray
    cap_drop:
      - ALL
    cap_add:
      # NET_ADMIN: admin 通过 docker exec 在容器内恢复轮换 IPv6 地址需要。
      - NET_ADMIN
      # CHOWN: nginx master 进程需要 chown /var/cache/nginx/* 给 worker (uid 101)
      - CHOWN
      # SETGID+SETUID: nginx master 以 root 运行，worker 需要降权到 nginx (uid 101)
      - SETGID
      - SETUID
      # DAC_OVERRIDE: logrotate 后 master reopen 会把日志 chown 给 uid 101(0644),
      # 此后 root master 无此 cap 便打不开自己的日志文件,reload(新 cycle 重新
      # 打开日志)全部静默失败——封禁同步/IP 轮换/配置更新长期不生效。HTTP 暴露
      # 面在无任何 cap 的 worker 上,master 多此 cap 风险可控(docker 默认含此 cap)。
      - DAC_OVERRIDE
    depends_on:
      admin:
        condition: service_healthy
      xray:
        condition: service_healthy
    healthcheck:
      # 只探测真实存活信号(serving /nginx-health 返回 204)。不再跑 nginx -t:
      # 其会以 root 打开 error_log 文件做校验,而日志文件归 uid 101(worker),
      # cap_drop:ALL 下 root 无 DAC_OVERRIDE 无法写入 → 误报 unhealthy。配置语法
      # 已在启动时校验,reload 失败也会安全保留旧配置,运行期无需重复 nginx -t。
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/nginx-health >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  xray:
    image: workwork-xray:${IMAGE_TAG:-latest}
    build:
      context: ./services/xray
      dockerfile: Dockerfile
      args:
        ALPINE_VERSION: ${ALPINE_VERSION:-3.24.1}
    restart: unless-stopped
    environment:
      - TZ=Asia/Shanghai
    init: true
    deploy:
      resources:
        limits:
          # Reality + XHTTP + observatory 并发下 64M 偏紧，OOM 会静默重启代理；
          # 放宽到 128M 留出 TLS 握手与连接缓冲余量。
          memory: 128M
          cpus: "1.0"
    security_opt:
      - "no-new-privileges:true"
    # IPv4 443 由 xray-forward 发布(连接 ipvlan 后 Docker 端口映射失效)
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    cap_drop:
      - ALL
    cap_add:
      # NET_ADMIN: entrypoint.sh 中 ip route 需要
      # SETGID+SETUID: su-exec 降权到 appuser 需要
      # CHOWN: entrypoint.sh 复制 root-only 配置后交给 appuser 读取
      # NET_BIND_SERVICE 不需要：容器内 ip_unprivileged_port_start=0，所有端口对非 root 开放
      - NET_ADMIN
      - SETGID
      - SETUID
      - CHOWN
    entrypoint: ["/entrypoint.sh"]
    group_add:
      # 1001: read generated xray config after admin tightens it to 0640.
      - "1001"
    networks:
      # Keep the dedicated bridge first so Docker publishes host IPv4 443 to
      # xray's egress bridge IP without joining the private admin/media network.
      # Public IPv6 reaches xray directly through ipvlan_docker.
      xray_egress: {}
      ipvlan_docker:
        ipv6_address: "${XRAY_IPV6}"
    volumes:
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
      - ./services/xray/entrypoint.sh:/entrypoint.sh:ro
      - ./.wework/generated/xray:/etc/xray:ro
      - xray_socket:/run/xray
    depends_on:
      admin:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -S /run/xray/xrxh.socket && nc -z 127.0.0.1 443"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # IPv4 直连发布: 宿主 0.0.0.0:443 → socat → xray_egress 网络内 xray:443。
  # xray 同时连接 ipvlan 时 Docker(29.x) 会把 ipvlan 选为 gwep4,端口映射
  # 整体失效(与连接顺序无关),因此 IPv4 入站由这个纯 bridge 容器发布。
  xray-forward:
    image: workwork-xray-forward:${IMAGE_TAG:-latest}
    build:
      context: ./services/xray
      dockerfile: Dockerfile.forward
      args:
        ALPINE_VERSION: ${ALPINE_VERSION:-3.24.1}
    restart: unless-stopped
    init: true
    environment:
      - TZ=Asia/Shanghai
    networks:
      - xray_egress
    security_opt:
      - "no-new-privileges:true"
    deploy:
      resources:
        limits:
          # socat fork 每连接一进程(约 1-2MB/进程),32M 在 20-30 并发即 OOM;
          # 128M 支撑 max-children=256 的正常水位,pids 兜底防 fork 洪泛。
          memory: 128M
          cpus: "0.25"
          pids: 300
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    cap_drop:
      - ALL
    ports:
      - "0.0.0.0:443:443"
    volumes:
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      xray:
        condition: service_healthy
    healthcheck:
      # 转发面只关心本容器 443 是否在监听；xray 本身健康由 xray 的
      # healthcheck 保证，这里不做重复的端到端探测。
      test: ["CMD", "nc", "-z", "127.0.0.1", "443"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  media_server:
    image: workwork-media_server:${IMAGE_TAG:-latest}
    build:
      context: ./services/media_center/media_server
      dockerfile: Dockerfile
      args:
        GIT_VERSION: ${MEDIA_CENTER_VERSION:-dev}
    restart: unless-stopped
    init: true
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: "0.25"
    security_opt:
      - "no-new-privileges:true"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal_docker
    cap_drop:
      - ALL
    tmpfs:
      # /cache 在 Dockerfile 中声明为 VOLUME 但服务未使用；用 tmpfs 覆盖避免匿名卷累积。
      - /cache
    environment:
      - TZ=Asia/Shanghai
      - HOST=0.0.0.0
      - PORT=8787
      - CONTENT_CATEGORIES_FILE=/config/contentCategories.json
      # Provider 凭证（如 bilibili SESSDATA），由 admin 生成注入。
      - PROVIDER_CREDENTIALS_FILE=/config/providerCredentials.json
      # 分类维护数据库(catalog)与内部管理接口令牌。
      - MEDIA_SERVER_CATALOG_DB=/app/data/catalog.db
      - MEDIA_SERVER_INTERNAL_TOKEN=${MEDIA_SERVER_INTERNAL_TOKEN:-}
      # App 更新下载地址:显式固定公网基址,禁止从请求 Host 头推导(防 Host 头投毒
      # 引导恶意 APK)。留空时 media_server 只接受白名单/内网 Host,公网不可用。
      - MEDIA_SERVER_PUBLIC_URL=${MEDIA_SERVER_PUBLIC_URL:-https://yinghuoren.com/api/media}
      # App 端凭证接口令牌:与 App 构建时注入的 APP_API_TOKEN 一致;为空则凭证
      # 接口一律 401(App 降级无凭证模式)。
      - MEDIA_SERVER_APP_API_TOKEN=${MEDIA_SERVER_APP_API_TOKEN:-}
      # youtube provider 实时通道:搜索与播放解析均经 vod_extractor(yt-dlp),
      # 无 Data API 配额;基址为空则两个端点都返回 503,见 media_server/youtube.go。
      - MEDIA_SERVER_VOD_EXTRACTOR_URL=${MEDIA_SERVER_VOD_EXTRACTOR_URL:-http://vod_extractor:8790}
    volumes:
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
      - ./.wework/generated/media_center:/config:ro
      - media_center_data:/app/data
    depends_on:
      admin:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8787/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # YouTube 点播解析(yt-dlp 的 HTTP 封装):供 media_server 的
  # /api/providers/youtube/resolve 解析播放直链;仅容器内网,不对外暴露端口。
  # 播放硬前提:YouTube 对数据中心 IP 一律 bot 检测,必须在宿主机放置 cookies:
  #   .wework/vod_extractor/youtube-cookies.txt (Netscape 格式,只读挂载为 /config)
  vod_extractor:
    image: workwork-vod_extractor:${IMAGE_TAG:-latest}
    build:
      context: ./services/media_center/vod_extractor
      dockerfile: Dockerfile
      args:
        GIT_VERSION: ${MEDIA_CENTER_VERSION:-dev}
    restart: unless-stopped
    init: true
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    security_opt:
      - "no-new-privileges:true"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal_docker
    cap_drop:
      - ALL
    environment:
      - TZ=Asia/Shanghai
      - HOST=0.0.0.0
      - PORT=8790
      - VOD_EXTRACTOR_TIMEOUT_MS=${VOD_EXTRACTOR_TIMEOUT_MS:-30000}
      - VOD_EXTRACTOR_MAX_OUTPUT_BYTES=${VOD_EXTRACTOR_MAX_OUTPUT_BYTES:-20971520}
      - VOD_EXTRACTOR_MAX_CONCURRENT=${VOD_EXTRACTOR_MAX_CONCURRENT:-2}
      # 如 youtube:player_client=tv;留空走 yt-dlp 默认
      - VOD_EXTRACTOR_EXTRACTOR_ARGS=${VOD_EXTRACTOR_EXTRACTOR_ARGS:-}
      # 显式置空(默认自动用 /config/youtube-cookies.txt,存在即生效)
      - VOD_EXTRACTOR_COOKIES_FILE=${VOD_EXTRACTOR_COOKIES_FILE:-}
    volumes:
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
      - ./.wework/vod_extractor:/config:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8790/health', timeout=2).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # 网易云 API 上游(NeteaseCloudMusicApi Enhanced,非官方接口仅限个人使用):
  # 仅容器内网,供 music_server 聚合搜索与流解析;不对外暴露端口。
  netease_api:
    image: workwork-netease_api:${IMAGE_TAG:-latest}
    build:
      context: ./services/netease_api
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    security_opt:
      - "no-new-privileges:true"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal_docker
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    environment:
      - TZ=Asia/Shanghai

  # 在线音乐服务:聚合本地曲库目录(扫描/搜索/Range 流式播放)与网易云网络源
  # (netease_api 上游,失败自动降级为仅本地)。曲库音频经管理面板「音乐曲库」
  # 页上传(admin rw 挂载同目录)或手动投放;经 nginx 以 /api/music/ 前缀对外
  # 暴露,认证模型同 media API(边缘 CF mTLS)。网络源音频由本服务代理转发。
  # 服务源码在 music_player 子模块内(客户端+服务端同仓库,组织方式同 media_center)。
  music_server:
    image: workwork-music_server:${IMAGE_TAG:-latest}
    build:
      context: ./services/music_player/music_server
      dockerfile: Dockerfile
      args:
        GIT_VERSION: ${MUSIC_PLAYER_VERSION:-dev}
    restart: unless-stopped
    init: true
    # 以 uid 1001(workuser)运行:曲库音频(admin 1001 上传/手动投放,0600)与
    # admin 写入的网易云 cookie 文件(0600)仅属主可读;镜像默认 appuser(10001)
    # 读两者都会 permission denied——表现为曲库能列出但播放 404、扫码登录
    # 不生效。二进制 0755 任意用户可执行,/tmp 为 tmpfs,无其他 uid 依赖。
    user: "1001:1001"
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"
    security_opt:
      - "no-new-privileges:true"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal_docker
    cap_drop:
      - ALL
    tmpfs:
      - /tmp
    environment:
      - TZ=Asia/Shanghai
      - HOST=0.0.0.0
      - PORT=8790
      - LIBRARY_DIR=/data/library
      - NETEASE_API_BASE=http://netease_api:3000
      - NETEASE_MUSIC_COOKIE=${NETEASE_MUSIC_COOKIE:-}
      # 管理面板扫码登录写入的 cookie(热加载);目录与 admin 共享(.wework)
      - NETEASE_COOKIE_FILE=/data/netease/netease-cookie.txt
      # 可选应用层鉴权:配置后业务端点要求 X-App-Token(与 media_server 的
      # MEDIA_SERVER_APP_API_TOKEN 同构);空 = 依赖边缘 CF mTLS,不鉴权。
      - MUSIC_SERVER_APP_API_TOKEN=${MUSIC_SERVER_APP_API_TOKEN:-}
    volumes:
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
      - ./.wework/music-library:/data/library:ro
      - ./.wework/generated/music:/data/netease:ro
    depends_on:
      - netease_api
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8790/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  admin:
    image: workwork-admin:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: ./services/admin/Dockerfile
      args:
        BUN_VERSION: ${BUN_VERSION:-1.3.14}
        GO_VERSION: ${GO_VERSION:-1.26.5}
        ALPINE_VERSION: ${ALPINE_VERSION:-3.24.1}
        GIT_VERSION: ${GIT_VERSION:-dev}
    restart: unless-stopped
    init: true
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
    security_opt:
      - "no-new-privileges:true"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    user: "1001:1001"
    group_add:
      - "${DOCKER_GID:-988}"
    networks:
      - internal_docker
    cap_drop:
      - ALL
    environment:
      - TZ=Asia/Shanghai
      - COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME:-workwork}
      - CF_API_TOKEN=${CF_API_TOKEN:-}
      - INTERNAL_TOKEN=${INTERNAL_TOKEN:-}
      # 可选:internal token 路径前缀白名单(逗号分隔)。配置后 X-Internal-Token
      # 只能豁免这些前缀,其余路径退回正常认证;留空保持全权(兼容外部自动化)。
      - INTERNAL_TOKEN_ALLOWED_PREFIXES=${INTERNAL_TOKEN_ALLOWED_PREFIXES:-}
      - TRUSTED_PROXY_CIDRS=${TRUSTED_PROXY_CIDRS:-}
      - TRUSTED_PROXY_HOSTS=${TRUSTED_PROXY_HOSTS:-}
      # IPv6 轮换（startupRotateIPv6 必需）
      - IPV6_SUBNET=${IPV6_SUBNET:-}
      - XRAY_IPV6=${XRAY_IPV6:-}
      - NGINX_IPV6=${NGINX_IPV6:-}
      # 媒体中心分类预采集管理：admin 代理 media_server 内部接口（同一令牌）
      - MEDIA_SERVER_INTERNAL_TOKEN=${MEDIA_SERVER_INTERNAL_TOKEN:-}
      - MEDIA_CENTER_INTERNAL_URL=${MEDIA_CENTER_INTERNAL_URL:-http://media_server:8787}
      # 网易云扫码登录：admin 调 netease_api 上游
      - NETEASE_API_BASE=${NETEASE_API_BASE:-http://netease_api:3000}
      # 可选:关键事件通知(Security 封禁/解封、限流自动封禁、xhttp 自愈达上限),
      # admin 异步 POST JSON,失败只记日志;部署失败通知也读同名变量。
      - WEBHOOK_URL=${WEBHOOK_URL:-}
    volumes:
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./.env:/app/.env:ro
      - ./logs:/app/logs
      - ./.wework:/app/data
      # 媒体默认分类来自 media_center 子模块(子模块源文件,不随 admin 镜像
      # 分发,故保持挂载;nginx/xray 模板已改为构建期 COPY 进 admin 镜像)。
      - ./services/media_center/media_server/src/contentCategories.json:/app/configs/media-center-content-categories.json:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8318/api/admin/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  ipvlan_docker:
    external: true
  internal_docker:
    driver: bridge
  xray_egress:
    driver: bridge

volumes:
  xray_socket:
  media_center_data:
