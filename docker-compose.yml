networks:
  # 外部 ipvlan 网络，所有外部容器共用，需先通过 setup-networks.sh 创建
  external_net:
    external: true
    name: ipvlan_docker
  # 内部桥接网络，用于 nginx 与 xray 之间通信
  internal_net:
    driver: bridge
    internal: true

x-web: &web-template
  build: ./website
  restart: unless-stopped
  networks:
    - external_net

x-nginx: &nginx-template
  build: ./nginx
  restart: unless-stopped
  networks:
    - external_net
    - internal_net

x-xray: &xray-template
  image: teddysun/xray
  restart: unless-stopped
  networks:
    - external_net
    - internal_net

services:
  # ========== 网站容器 ==========
  # 复制并修改后缀即可增加更多实例
  web-1:
    <<: *web-template
  web-2:
    <<: *web-template

  # ========== Nginx XHTTP 代理容器 ==========
  # 每个 nginx 实例对应一个 xray 实例，通过内部网络通信
  nginx-xhttp-liyou:
    <<: *nginx-template
    volumes:
      - ./cert:/etc/nginx/certs:ro
      - ./configs/nginx-xhttp-liyou.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - xray-reality-liyou
  nginx-xhttp-liusai:
    <<: *nginx-template
    volumes:
      - ./cert:/etc/nginx/certs:ro
      - ./configs/nginx-xhttp-liusai.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - xray-reality-liusai

  # ========== Xray Reality 容器 ==========
  # 同时提供 reality 直连（external_net）和 xhttp 上游（internal_net）
  xray-reality-liyou:
    <<: *xray-template
    volumes:
      - ./configs/xray-reality-liyou.json:/etc/xray/config.json:ro
  xray-reality-liusai:
    <<: *xray-template
    volumes:
      - ./configs/xray-reality-liusai.json:/etc/xray/config.json:ro
