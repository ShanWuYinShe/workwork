name: workwork

services:
  nginx:
    build:
      context: ./services/nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      ipvlan_docker:
        ipv6_address: "${NGINX_IPV6}"
      internal_docker:
    volumes:
      - ./cert:/etc/nginx/certs:ro
      - ./services/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./services/nginx/.htpasswd:/etc/nginx/htpasswd/.htpasswd:ro
      - ./logs/nginx:/var/log/nginx
      - ./services/nginx/config/fail2ban:/etc/fail2ban/custom:ro
      - ./services/nginx/fail2ban-data:/var/lib/fail2ban/data
      - ./.wework/.internal-token:/etc/fail2ban/.internal-token:ro
      - /dev/shm:/dev/shm
    cap_add:
      - NET_ADMIN
    depends_on:
      xray:
        condition: service_started
    healthcheck:
      test: ["CMD", "pgrep", "nginx"]
      interval: 30s
      timeout: 5s
      retries: 3

  xray:
    build:
      context: ./services/xray
      dockerfile: Dockerfile
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    entrypoint: ["/entrypoint.sh"]
    networks:
      ipvlan_docker:
        ipv6_address: "${XRAY_IPV6}"
      internal_docker:
        aliases:
          - xray-internal
    volumes:
      - ./services/xray/entrypoint.sh:/entrypoint.sh:ro
      - ./services/xray/config.json:/etc/xray/config.json:ro
      - /dev/shm:/dev/shm
    healthcheck:
      test: ["CMD", "pgrep", "xray"]
      interval: 30s
      timeout: 5s
      retries: 3

  cliproxy-public:
    build:
      context: ./services/cliproxy
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - internal_docker
    labels:
      - "app=cliproxy"
      - "cliproxy.user=public"
    volumes:
      - ./services/cliproxy/config.yaml:/CLIProxyAPI/config.yaml:ro
      - ./cliproxy-data/public:/root/.cli-proxy-api
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8317/"]
      interval: 30s
      timeout: 5s
      retries: 3

  admin:
    build:
      context: .
      dockerfile: ./services/admin/Dockerfile
    restart: unless-stopped
    networks:
      - internal_docker
    environment:
      - HTPASSWD_FILE=/app/htpasswd
      - CF_API_TOKEN=${CF_API_TOKEN:-}
      - INTERNAL_TOKEN=${INTERNAL_TOKEN:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./.env:/app/.env:ro
      - ./logs:/app/logs
      - ./services/nginx/.htpasswd:/app/htpasswd:rw
      - ./services/nginx/nginx.conf:/app/configs/nginx.conf:rw
      - ./services/nginx/nginx.conf.tmpl:/app/configs/nginx.conf.tmpl:ro
      - ./.wework:/app/data
      - ./services/xray/config.json:/app/configs/xray.json:rw
      - ./services/xray/config.json.tmpl:/app/configs/xray.json.tmpl:ro
      - ./services/cliproxy/config.yaml:/app/configs/cliproxy.yaml:rw
      - ./services/cliproxy/config.yaml.tmpl:/app/configs/cliproxy.yaml.tmpl:ro
      - ./cliproxy-data:/app/cliproxy-data
    depends_on:
      - nginx
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8318/api/admin/health"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  ipvlan_docker:
    external: true
  internal_docker:
    driver: bridge
