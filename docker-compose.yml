name: workwork

services:
  nginx:
    build:
      context: ./services/nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      ipvlan_docker:
        ipv6_address: "${NGINX_IPV6}"
      internal_docker:
    group_add:
      # 1001: read the fail2ban token generated by admin as 0640.
      - "1001"
      # 101: nginx workers need group access to xray's 0660 Unix socket.
      - "101"
    volumes:
      - ./cert:/etc/nginx/certs:ro
      - ./.wework/generated/nginx:/etc/nginx/conf.d:ro
      - ./.wework/nginx-auth:/etc/nginx/htpasswd:ro
      - ./logs/nginx:/var/log/nginx
      - ./services/nginx/config/fail2ban:/etc/fail2ban/custom:ro
      - ./services/nginx/fail2ban-data:/var/lib/fail2ban/data
      - ./.wework/.fail2ban-token:/etc/workwork/.fail2ban-token:ro
      - xray_socket:/run/xray
    cap_drop:
      - ALL
    cap_add:
      # NET_ADMIN: admin 通过 docker exec 在容器内恢复轮换 IPv6 地址需要。
      - NET_ADMIN
      # CHOWN: nginx master 进程需要 chown /var/cache/nginx/* 给 worker (uid 101)
      - CHOWN
      # SETGID+SETUID: nginx master 以 root 运行，worker 需要降权到 nginx (uid 101)
      - SETGID
      - SETUID
    depends_on:
      admin:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nginx -t >/dev/null && curl -fsS http://127.0.0.1:8080/nginx-health >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  xray:
    build:
      context: ./services/xray
      dockerfile: Dockerfile
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    ports:
      - "0.0.0.0:443:443"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    cap_drop:
      - ALL
    cap_add:
      # NET_ADMIN: entrypoint.sh 中 ip route 需要
      # SETGID+SETUID: su-exec 降权到 appuser 需要
      # CHOWN: entrypoint.sh 复制 root-only 配置后交给 appuser 读取
      # NET_BIND_SERVICE 不需要：容器内 ip_unprivileged_port_start=0，所有端口对非 root 开放
      - NET_ADMIN
      - SETGID
      - SETUID
      - CHOWN
    entrypoint: ["/entrypoint.sh"]
    group_add:
      # 1001: read generated xray config after admin tightens it to 0640.
      - "1001"
    networks:
      # Keep the dedicated bridge first so Docker publishes host IPv4 443 to
      # xray's egress bridge IP without joining the private admin/media network.
      # Public IPv6 reaches xray directly through ipvlan_docker.
      xray_egress: {}
      ipvlan_docker:
        ipv6_address: "${XRAY_IPV6}"
    volumes:
      - ./services/xray/entrypoint.sh:/entrypoint.sh:ro
      - ./.wework/generated/xray:/etc/xray:ro
      - xray_socket:/run/xray
    depends_on:
      admin:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -S /run/xray/xrxh.socket && nc -z 127.0.0.1 443"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  vod_extractor:
    build:
      context: ./services/media_center/vod_extractor
      dockerfile: Dockerfile
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal_docker
    cap_drop:
      - ALL
    environment:
      - HOST=0.0.0.0
      - PORT=8790
      - VOD_EXTRACTOR_TIMEOUT_MS=${VOD_EXTRACTOR_TIMEOUT_MS:-30000}
      - VOD_EXTRACTOR_MAX_OUTPUT_BYTES=${VOD_EXTRACTOR_MAX_OUTPUT_BYTES:-20971520}
      - VOD_EXTRACTOR_MAX_CONCURRENT=${VOD_EXTRACTOR_MAX_CONCURRENT:-2}
      - VOD_EXTRACTOR_EXTRACTOR_ARGS=${VOD_EXTRACTOR_EXTRACTOR_ARGS:-}
      - VOD_EXTRACTOR_COOKIES_FILE=${VOD_EXTRACTOR_COOKIES_FILE:-}
    volumes:
      - ./.wework/vod_extractor:/config:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8790/health', timeout=2).read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  media_server:
    build:
      context: ./services/media_center/media_server
      dockerfile: Dockerfile
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal_docker
    cap_drop:
      - ALL
    environment:
      - HOST=0.0.0.0
      - PORT=8787
      - CONTENT_CATEGORIES_FILE=/config/contentCategories.json
      - PROVIDER_FETCH_TIMEOUT_MS=${MEDIA_SERVER_PROVIDER_FETCH_TIMEOUT_MS:-15000}
      - MEDIA_SERVER_SIGNING_KEY=${MEDIA_SERVER_SIGNING_KEY:-}
      - MEDIA_ASSET_SIGNING_KEY=${MEDIA_ASSET_SIGNING_KEY:-}
      - MEDIA_SERVER_CATEGORY_MAX_PAGES=${MEDIA_SERVER_CATEGORY_MAX_PAGES:-6}
      - MEDIA_ASSET_CACHE_DIR=/cache
      - MEDIA_ASSET_CACHE_MAX_BYTES=${MEDIA_ASSET_CACHE_MAX_BYTES:-53687091200}
      - VOD_EXTRACTOR_URL=http://vod_extractor:8790/extract
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY:-}
    volumes:
      - ./.wework/generated/media_center:/config:ro
      - media_asset_cache:/cache
    depends_on:
      admin:
        condition: service_healthy
      vod_extractor:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8787/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  admin:
    build:
      context: .
      dockerfile: ./services/admin/Dockerfile
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    user: "1001:1001"
    group_add:
      - "${DOCKER_GID:-988}"
    networks:
      - internal_docker
    cap_drop:
      - ALL
    environment:
      - COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME:-workwork}
      - CF_API_TOKEN=${CF_API_TOKEN:-}
      - INTERNAL_TOKEN=${INTERNAL_TOKEN:-}
      - TRUSTED_PROXY_CIDRS=${TRUSTED_PROXY_CIDRS:-}
      - TRUSTED_PROXY_HOSTS=${TRUSTED_PROXY_HOSTS:-}
      # IPv6 轮换（startupRotateIPv6 必需）
      - IPV6_SUBNET=${IPV6_SUBNET:-}
      - XRAY_IPV6=${XRAY_IPV6:-}
      - NGINX_IPV6=${NGINX_IPV6:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./.env:/app/.env:ro
      - ./logs:/app/logs
      - ./services/nginx/nginx.conf.tmpl:/app/configs/nginx.conf.tmpl:ro
      - ./.wework:/app/data
      - ./services/xray/config.json.tmpl:/app/configs/xray.json.tmpl:ro
      - ./services/media_center/media_server/src/contentCategories.json:/app/configs/media-center-content-categories.json:ro
      - ./services/nginx:/app/legacy-nginx:ro
      - ./services/xray:/app/legacy-xray:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8318/api/admin/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  ipvlan_docker:
    external: true
  # 固定子网：与 CLAUDE.md 文档一致，且让 xray entrypoint 的 /172\./ 网卡匹配
  # 始终命中 172.x，避免 Docker 默认池耗尽时自动分配到非 172 段而断 IPv4 出口。
  internal_docker:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
  xray_egress:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16

volumes:
  xray_socket:
  media_asset_cache:
