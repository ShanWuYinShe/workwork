name: workwork

services:
  nginx:
    build:
      context: ./services/nginx
      dockerfile: Dockerfile
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      ipvlan_docker:
        ipv6_address: "${NGINX_IPV6}"
      internal_docker:
    volumes:
      - ./cert:/etc/nginx/certs:ro
      - ./.wework/generated/nginx:/etc/nginx/conf.d:ro
      - ./.wework/nginx-auth:/etc/nginx/htpasswd:ro
      - ./logs/nginx:/var/log/nginx
      - ./services/nginx/config/fail2ban:/etc/fail2ban/custom:ro
      - ./services/nginx/fail2ban-data:/var/lib/fail2ban/data
      - ./.wework:/etc/workwork:ro
      - /dev/shm:/dev/shm
    cap_drop:
      - ALL
    cap_add:
      - NET_ADMIN
      # CHOWN: nginx master 进程需要 chown /var/cache/nginx/* 给 worker (uid 101)
      - CHOWN
    depends_on:
      admin:
        condition: service_healthy
      xray:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'nginx: master' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  xray:
    build:
      context: ./services/xray
      dockerfile: Dockerfile
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    ports:
      - "443:443"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    cap_drop:
      - ALL
    cap_add:
      # NET_ADMIN: entrypoint.sh 中 ip route 需要
      # SETGID+SETUID: su-exec 降权到 appuser 需要
      # CHOWN: entrypoint.sh 复制 root-only 配置后交给 appuser 读取
      # NET_BIND_SERVICE 不需要：容器内 ip_unprivileged_port_start=0，所有端口对非 root 开放
      - NET_ADMIN
      - SETGID
      - SETUID
      - CHOWN
    entrypoint: ["/entrypoint.sh"]
    networks:
      ipvlan_docker:
        ipv6_address: "${XRAY_IPV6}"
      internal_docker:
        aliases:
          - xray-internal
    volumes:
      - ./services/xray/entrypoint.sh:/entrypoint.sh:ro
      - ./.wework/generated/xray:/etc/xray:ro
      - /dev/shm:/dev/shm
    depends_on:
      admin:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 443 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  admin:
    build:
      context: .
      dockerfile: ./services/admin/Dockerfile
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - internal_docker
    cap_drop:
      - ALL
    environment:
      - CF_API_TOKEN=${CF_API_TOKEN:-}
      - INTERNAL_TOKEN=${INTERNAL_TOKEN:-}
      # IPv6 轮换（startupRotateIPv6 必需）
      - IPV6_SUBNET=${IPV6_SUBNET:-}
      - XRAY_IPV6=${XRAY_IPV6:-}
      - NGINX_IPV6=${NGINX_IPV6:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./.env:/app/.env:ro
      - ./logs:/app/logs
      - ./services/nginx/nginx.conf.tmpl:/app/configs/nginx.conf.tmpl:ro
      - ./.wework:/app/data
      - ./services/xray/config.json.tmpl:/app/configs/xray.json.tmpl:ro
      - ./services/nginx:/app/legacy-nginx:ro
      - ./services/xray:/app/legacy-xray:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8318/api/admin/health"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  ipvlan_docker:
    external: true
  internal_docker:
    driver: bridge
