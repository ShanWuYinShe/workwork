# Nginx XHTTP 代理配置 - 合并版
log_format auth_log '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'upstream: $upstream_addr';

location /secure/ {
    auth_basic "Restricted";
    auth_basic_user_file /etc/nginx/htpasswd/.htpasswd;

    location /secure/proxy/query/ {
        access_log /var/log/nginx/proxy-query-access.log auth_log;
        proxy_pass http://xray-reality:8443;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        chunked_transfer_encoding on;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /secure/proxy/ws/ {
        access_log /var/log/nginx/proxy-ws-access.log auth_log;
        proxy_pass http://xray-reality:8444;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /secure/workwork/ {
        access_log /var/log/nginx/workwork-access.log auth_log;
        error_log /var/log/nginx/workwork-error.log warn;
        proxy_pass http://cliproxyapi:8317/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}