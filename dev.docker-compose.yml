networks:
  ipvlan_docker:
    external: true

services:
  postgres:
    image: postgres:16-alpine
    container_name: "${COMPOSE_PROJECT:-service}-postgres"
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-app}"
      POSTGRES_USER: "${POSTGRES_USER:-app}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-app123}"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      ipvlan_docker:
        ipv4_address: "${IPVLAN_IP_POSTGRES}"
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-app}"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 10s
    restart: unless-stopped
    labels:
      dev.env.type: "database"
      dev.env.service: "postgres"

  redis:
    image: redis:7-alpine
    container_name: "${COMPOSE_PROJECT:-service}-redis"
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - "256mb"
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - rd_data:/data
    networks:
      ipvlan_docker:
        ipv4_address: "${IPVLAN_IP_REDIS}"
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    labels:
      dev.env.type: "cache"
      dev.env.service: "redis"

  minio:
    image: minio/minio:latest
    container_name: "${COMPOSE_PROJECT:-service}-minio"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: "${MINIO_USER:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_PASSWORD:-minioadmin123}"
    volumes:
      - minio_data:/data
    networks:
      ipvlan_docker:
        ipv4_address: "${IPVLAN_IP_MINIO}"
    ports:
      - "${MINIO_API_PORT:-9002}:9000"
      - "${MINIO_CONSOLE_PORT:-9003}:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    labels:
      dev.env.type: "storage"
      dev.env.service: "minio"

  dev:
    build:
      context: ./dev
      dockerfile: Dockerfile
    container_name: "${COMPOSE_PROJECT:-service}-dev"
    stdin_open: true
    tty: true
    privileged: true
    volumes:
      - .:/workspace
      - dev_cache:/root/.cache
    environment:
      COMPOSE_PROJECT: "${COMPOSE_PROJECT:-service}"
      POSTGRES_HOST: "${COMPOSE_PROJECT:-service}-postgres"
      POSTGRES_PORT: 5432
      POSTGRES_DB: "${POSTGRES_DB:-app}"
      POSTGRES_USER: "${POSTGRES_USER:-app}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-app123}"
      PGPASSWORD: "${POSTGRES_PASSWORD:-app123}"
      REDIS_HOST: "${COMPOSE_PROJECT:-service}-redis"
      REDIS_PORT: 6379
      MINIO_ENDPOINT: "${COMPOSE_PROJECT:-service}-minio:9000"
      MINIO_USER: "${MINIO_USER:-minioadmin}"
      MINIO_PASSWORD: "${MINIO_PASSWORD:-minioadmin123}"
    networks:
      ipvlan_docker:
        ipv4_address: "${IPVLAN_IP_DEV}"
    ports:
      - "${DEV_PORT_1:-3000}:3000"
      - "${DEV_PORT_2:-3001}:3001"
      - "${DEV_PORT_3:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    labels:
      dev.env.type: "dev-container"
      dev.env.version: "4.1.0"

volumes:
  pg_data:
    name: "${COMPOSE_PROJECT:-service}_pg_data"
  rd_data:
    name: "${COMPOSE_PROJECT:-service}_rd_data"
  minio_data:
    name: "${COMPOSE_PROJECT:-service}_minio_data"
  dev_cache:
    name: "${COMPOSE_PROJECT:-service}_dev_cache"
